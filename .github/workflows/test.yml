name: Tests

# WHY THIS FILE EXISTS AT THE REPO ROOT.
#
# The template carries its own `.github/workflows/test.yml`, and that one is
# TEMPLATE CONTENT: it ships to generated projects. GitHub only reads workflows
# from the ROOT of a repository, so inside THIS repo that file has never run —
# and after `lt fullstack init` it lands in `projects/app/.github/`, where it
# does not run either (the monorepo's own CI covers that case).
#
# The consequence was a repo that released without ever testing itself. Only
# `release.yml` existed, and it just turns a tag into a GitHub release. That is
# how a better-auth version bump shipped here (commit 33979ce) and split client
# from server across every fullstack project: nothing in this repository ran a
# single test on it.
#
# So this file is the half that guards the repo, and the template's copy is the
# half that ships. `scripts/check-ci-placement.mjs` keeps both halves honest —
# it fails when a workflow lives somewhere it can never run, or when the two
# drift apart.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The full quality gate. `pnpm run check` at the root already chains into
  # `nuxt-base-template` (audit, format, lint, unit tests, both typecheck halves,
  # build, server-start), so this job stays a single call rather than a
  # re-implementation that can drift from what developers run locally.
  check:
    name: Check (root + template)
    runs-on: ubuntu-latest
    # Bounds a wedged job. Without it GitHub applies its 360-minute default,
    # which is long enough that a hung run is noticed by a human, not by CI.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      # The template has its OWN lockfile and its own node_modules, and it must be
      # installed separately — `pnpm run check` at the root only `cd`s into it.
      #
      # It cannot bootstrap itself either: the template's check chain STARTS with
      # `cross-env …`, which is one of its own devDependencies. Without this step
      # the run dies on `cross-env: not found` before a single check executes —
      # which is exactly how this job failed on its first run.
      - name: Install template dependencies
        working-directory: nuxt-base-template
        run: pnpm install --frozen-lockfile

      # Guards this file's own premise: no workflow may sit where it cannot run,
      # and the template's CI may not gain a job this one lacks. Runs before the
      # expensive gate so a misplaced workflow fails in seconds.
      - name: Verify CI placement
        run: node scripts/check-ci-placement.mjs

      - name: Run check
        run: pnpm run check
        # check-suppressions queries the GitHub Advisory API. With the token an entry it could not
        # verify fails the run; without one it only warns (the runner's shared IP quota).
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # -------------------------------------------------------------------------
  # The only job here that exercises BEHAVIOUR across the client/server
  # boundary. `check` above proves this repo is internally consistent — which is
  # exactly the property that stayed green while better-auth 1.6.26 on the API
  # and 1.7.1 in the app broke every 2FA activation in every fullstack project.
  #
  # BLOCKING on purpose. A non-blocking gate without a visibility path is worse
  # than no gate: it keeps looking like a net while catching nothing. If it ever
  # becomes too slow to block on, shard it (see lt-monorepo's app:test,
  # `parallel: 2`) rather than demoting it to advisory.
  # -------------------------------------------------------------------------
  e2e-auth:
    name: E2E Auth (against a real API)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The cheap gate first: a red check must not let this burn a full E2E budget.
    needs: [check]

    services:
      # Matches the rest of the stack's CI (lt-monorepo api:test / app:test).
      # Runs without authentication, which is what a throwaway CI service wants.
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      # The suite reads verification tokens out of the API log, because Better
      # Auth signs them as stateless JWTs that are never written to the database.
      # No log, no email-verification coverage.
      NEST_SERVER_LOG: ${{ github.workspace }}/api-e2e.log
      MONGO_URI: mongodb://127.0.0.1:27017/app-ci
      NSC__MONGOOSE__URI: mongodb://127.0.0.1:27017/app-ci
      API_URL: http://localhost:3000
      NUXT_PUBLIC_API_URL: http://localhost:3000
      NUXT_PUBLIC_SITE_URL: http://localhost:3001
      # Relaxes rate limiting and disables the Better-Auth user cache, so a
      # freshly promoted admin is recognised immediately.
      PLAYWRIGHT: 'true'
      # Switch on the API's AI module and its MCP server, which nest-server-starter
      # leaves off (no `ai` block in its config.env.ts). The AI visibility spec needs
      # the module (`GET /ai/status` 200), the MCP confirmation spec the MCP server
      # (`mcp: true`); because this job sets the variables, both fail instead of
      # skipping when the API lacks them. A throwaway value, like the admin
      # credentials below.
      NSC__AI__ENCRYPTION_SECRET: ci-e2e-throwaway-ai-encryption-secret-000
      NSC__AI__MCP__ENABLED: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The API half of the contract. This repo has no backend of its own, and
      # that is precisely why the split could go unnoticed here — the other side
      # was never present. `main` on purpose: the released starter is what
      # consumers actually pair this template with.
      - name: Checkout nest-server-starter (the API side of the contract)
        uses: actions/checkout@v4
        with:
          repository: lenneTech/nest-server-starter
          ref: main
          path: api

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install API dependencies
        working-directory: api
        run: pnpm install --frozen-lockfile

      - name: Build API
        working-directory: api
        run: pnpm run build

      # Migrations BEFORE the start: `start:e2e:dist` is bare node and does not
      # run them. Without them the demo data is missing and every test built on
      # it skips itself — a suite that quietly skips away reports green and
      # verifies nothing.
      - name: Run API migrations
        working-directory: api
        run: pnpm run migrate:up

      # The app comes first: the setup page is tested against two API starts on
      # the still empty database before the suite runs.
      - name: Install app dependencies
        working-directory: nuxt-base-template
        run: pnpm install --frozen-lockfile

      # Only Chromium: the suite's WebAuthn coverage drives a CDP virtual
      # authenticator, which is Chromium-only anyway.
      - name: Install Playwright browser
        working-directory: nuxt-base-template
        run: npx playwright install --with-deps chromium

      # A CI database is EMPTY, and an empty database is its own application
      # state: with zero users the app routes every visitor to /auth/setup to
      # create the first admin. Migrations do not cover it; they build the schema.
      # The setup page is tested in that state twice, before anything else
      # touches the database.
      #
      # First as a deployed system: nest-server 12.4.0+ closes the HTTP init
      # outside local, ci and e2e, and `NSC__SYSTEM_SETUP__HTTP_INIT=false` closes
      # it under e2e too. The API gets a process group of its own (setsid), and the
      # stop step signals that group. pnpm 11 starts its children in groups of
      # their own and passes the SIGTERM on, so cross-env and node end with it
      # (measured on Linux: :3000 was free for the next start). `$!` is captured so the
      # readiness loop can tell "still booting" from "already dead"; without it a
      # crashed API is only noticed when the timeout expires, as a timeout.
      - name: Start API with the HTTP init closed
        env:
          NSC__SYSTEM_SETUP__HTTP_INIT: 'false'
        run: |
          setsid bash -c 'cd api && exec pnpm run start:e2e:dist' > "$GITHUB_WORKSPACE/api-e2e-closed.log" 2>&1 &
          echo $! > /tmp/api-closed.pid
          timeout 180 bash -c '
            until curl -sf http://localhost:3000/meta > /dev/null; do
              kill -0 "$(cat /tmp/api-closed.pid)" 2>/dev/null || {
                echo "::error::API process died during boot"; tail -n 60 "$GITHUB_WORKSPACE/api-e2e-closed.log"; exit 1;
              }
              sleep 2
            done'
          echo "API is up, HTTP init closed"

      - name: Setup page without the HTTP init (hint instead of the form)
        working-directory: nuxt-base-template
        env:
          E2E_SETUP_CASE: closed
        run: pnpm exec playwright test tests/e2e/system-setup.spec.ts

      - name: Stop the API with the HTTP init closed
        run: |
          kill -- "-$(cat /tmp/api-closed.pid)"
          timeout 30 bash -c 'while curl -sf http://localhost:3000/meta > /dev/null; do sleep 1; done'
          echo "API stopped"

      - name: Start API and wait for readiness
        run: |
          (cd api && pnpm run start:e2e:dist > "$NEST_SERVER_LOG" 2>&1) &
          API_PID=$!
          timeout 180 bash -c '
            until curl -sf http://localhost:3000/meta > /dev/null; do
              kill -0 '"$API_PID"' 2>/dev/null || {
                echo "::error::API process died during boot"; tail -n 60 "$NEST_SERVER_LOG"; exit 1;
              }
              sleep 2
            done'
          echo "API is up"

      # Then as a local or e2e system, where the form creates the first admin.
      # It replaces the bare `POST /system-setup/init` this job sent before, and
      # its admin is the one the rest of the suite runs against: the suite expects
      # an installation past the setup, at /auth/login.
      - name: Create the first admin through the setup page
        working-directory: nuxt-base-template
        env:
          E2E_SETUP_CASE: open
        run: pnpm exec playwright test tests/e2e/system-setup.spec.ts

      # Fail here, not five specs later on a redirect to /auth/setup.
      - name: Check that the system is set up
        run: |
          curl -sf http://localhost:3000/system-setup/status | tee /tmp/setup-status.json
          jq -e '.needsSetup == false' /tmp/setup-status.json > /dev/null || {
            echo "::error::the setup page did not create the first admin"; exit 1;
          }

      # playwright.config.ts starts the app itself via its `webServer` block, so
      # only the API is booted above. system-setup.spec.ts skips here: it runs
      # only with E2E_SETUP_CASE, in the steps above.
      - name: Run auth E2E suite
        working-directory: nuxt-base-template
        run: pnpm run test:e2e

      # NEVER upload the API log: it carries live bearer credentials — a
      # verification token grants email verification for that account to whoever
      # holds it. The Playwright report is safe and is what a failure needs.
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: nuxt-base-template/playwright-report/
          retention-days: 7

  # -------------------------------------------------------------------------
  # Windows visibility job. NON-BLOCKING until Windows support is complete
  # (milestone M5, decision D4): it exists to show what is red on Windows, not
  # to gate merges. Flip `continue-on-error` off once it is green.
  #
  # Every check after the install runs even when an earlier one failed, so a
  # single run lists everything that breaks instead of stopping at the first.
  # No E2E yet, and no `pnpm run check`: the chain's server-start step is now
  # Node (`scripts/check-server-start.mjs`), but the full chain is not wired in yet.
  # -------------------------------------------------------------------------
  windows:
    name: Windows (non-blocking)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45

    steps:
      # Git for Windows defaults to core.autocrlf=true. Reproducing that before
      # the checkout proves .gitattributes keeps every text file LF; the format
      # check below turns a CRLF leak into a red step.
      - name: Emulate the Git for Windows line-ending default
        run: git config --global core.autocrlf true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install root dependencies
        id: root-install
        run: pnpm install --frozen-lockfile

      - name: Install template dependencies
        id: template-install
        working-directory: nuxt-base-template
        run: pnpm install --frozen-lockfile

      - name: Verify CI placement
        if: ${{ !cancelled() && steps.root-install.outcome == 'success' }}
        run: pnpm run check:ci-placement

      - name: Test repo scripts
        if: ${{ !cancelled() && steps.root-install.outcome == 'success' }}
        run: pnpm run test:scripts

      - name: Format check (template)
        if: ${{ !cancelled() && steps.template-install.outcome == 'success' }}
        working-directory: nuxt-base-template
        run: pnpm run format:check

      - name: Lint (template)
        if: ${{ !cancelled() && steps.template-install.outcome == 'success' }}
        working-directory: nuxt-base-template
        run: pnpm run lint

      - name: Unit tests (template)
        if: ${{ !cancelled() && steps.template-install.outcome == 'success' }}
        working-directory: nuxt-base-template
        run: pnpm run test:unit
