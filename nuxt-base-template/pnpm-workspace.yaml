# pnpm settings for the nuxt-base-template (single-package project).
#
# IMPORTANT: This file intentionally has NO `packages:` field. It carries
# ONLY workspace-scoped settings (overrides, auditConfig, allowBuilds /
# onlyBuiltDependencies, minimumReleaseAgeExclude). This is the pnpm-recommended home for
# these keys and is read by pnpm 10 AND pnpm 11. (pnpm 11 silently ignores the
# same keys when they live in package.json's `pnpm` block.)
#
# All override TARGETS (right-hand side) are FIXED versions, never ranges,
# to prevent silent major-version jumps (see TurboOps incident, April 2026).
# The LEFT side may carry a range to scope which vulnerable versions are
# replaced. The advisory table for every override lives in CLAUDE.md.

# ----------------------------------------------------------------------------------
# Advisories that cannot be fixed by an override, and why the residual is acceptable.
#
# Rules for adding one: name the advisory, say why it cannot be fixed, say why the
# residual risk is acceptable, and date the verification. If you cannot write those
# three sentences honestly, fix the dependency instead. An entry here is a debt, not
# a decision — every one carries the condition under which it gets deleted again.
#
# Worth knowing before adding one: this file used to suppress the two HIGH image-size
# advisories (GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq). The justification was sound
# and the stated delete-condition — "as soon as image-size 2.0.3 is published" —
# would never have fired, because 2.0.3 was never released. The dependency left the
# tree instead: @nuxtjs/seo 5.3.14 pulls nuxt-seo-utils 8.4.2, which swapped
# image-size for buffer-image-size. So the entry outlived its cause by a full release
# cycle. Prefer a delete-condition you can actually observe ("this package no longer
# resolves"), and re-check suppressions on every dependency bump, not only when the
# named fix version appears. `scripts/check-suppressions.mjs` (part of `check`) does both
# for every entry: it fails once the advisory gets an installable fix, is withdrawn, or
# its package no longer resolves to a vulnerable version.
# ----------------------------------------------------------------------------------
auditConfig:
  ignoreGhsas:
    # GHSA-gcqx-w48m-w2h4 (low): deepmerge <=4.3.1, mergeObject() does not validate the keys it
    # writes, so a crafted SOURCE object can poison the prototype of the returned object.
    #
    # Path: nuxt > @nuxt/nitro-server > nitropack > @rollup/plugin-node-resolve 16.0.3 >
    # deepmerge 4.3.1, the only consumer in the tree.
    #
    # Not fixable: (1) no override target. 4.3.1 (2023-03-16) is the newest deepmerge on npm, and
    # GitHub lists no first patched version. Raising the consumer does not help: 16.0.3 is the
    # newest @rollup/plugin-node-resolve and still requests ^4.2.2. (2) No patch: there is no
    # patched release whose shape a consumer would need adapting to, and writing our own fix into
    # the library is not what step 2 is for.
    #
    # Residual risk, none reachable: plugin-node-resolve calls deepmerge exactly once, at module
    # load, as `deepMerge({}, defaults)`, where `defaults` is its own hard-coded options constant.
    # No input, from a developer or anyone else, ever reaches the merge. It runs only inside
    # `nuxt build` / `nuxt dev`, and `.output/` contains no deepmerge.
    #
    # Delete when `pnpm audit` is clean without this entry, i.e. a patched deepmerge resolves or
    # plugin-node-resolve drops it; `check-suppressions.mjs` reports both. First reported by
    # `pnpm audit` on 2026-10-28 (advisory published 2026-09-18). Verified 2026-10-28.
    - GHSA-gcqx-w48m-w2h4
    # The node-forge entry (GHSA-86w9-cpqp-85rv, node-forge <=1.4.0 via nitropack > listhen) was
    # removed on 2026-10-28. node-forge 1.4.1 (published 2026-10-27) fixes it, its changelog lists
    # the "ASN.1 extra field in DigestAlgorithm" forgery, and it cleared the one-day release-age
    # gate that morning. A fresh resolve got 1.4.1 and `check-suppressions.mjs` reported the entry
    # NOT IN TREE, although GitHub still names no first patched version. The lockfile resolves
    # 1.4.2 since that afternoon (listhen asks for ^1.4.0), which also fixes a `pem.decode()`
    # regression of 1.4.1 for Buffer input; listhen hands forge only strings either way.
    # The braces entry (GHSA-vfj7-8cjw-p6xm, braces 3.0.3 via nitropack > globby) was removed
    # on 2026-10-24: GitHub withdrew the advisory on 2026-10-23, `check-suppressions.mjs`
    # reported it WITHDRAWN, and `pnpm audit` stays clean without the entry.

# pnpm 11 renamed `onlyBuiltDependencies` to `allowBuilds` (map of pkg -> bool).
# We keep BOTH keys so the file works across pnpm 10 (reads onlyBuiltDependencies)
# and pnpm 11 (reads allowBuilds); each version ignores the key it doesn't know.
allowBuilds:
  # Not in the template's own tree: an optional peer of nuxt and listhen (the faster file
  # watcher). Kept so a project that adds it does not stop with ERR_PNPM_IGNORED_BUILDS,
  # which pnpm 11 raises for every unapproved build script (measured 2026-10-24).
  '@parcel/watcher': true
  esbuild: true
  simple-git-hooks: true
  vue-demi: true

# No `ignoredOptionalDependencies` and no build approval for sharp any more (removed
# 2026-10-24 together with @nuxt/image, the only package that pulled sharp in hard, via ipx).
# The list skipped every Linux and Windows binary of sharp and resvg; in the node:24-alpine
# image that left sharp without a binary, so `/_ipx` could not have processed a raster image.
# A fresh resolve now contains neither package, and sharp 0.35 needs no build script.
# A project that adds @nuxt/image back must NOT ignore the `@img/sharp-linuxmusl-*` binaries.

minimumReleaseAgeExclude:
  # ONLY our own first-party scope. The glob exempts every @lenne.tech package and
  # every fresh release from the minimum-release-age gate (honored at resolution AND
  # lockfile-verify time) — installable the moment we publish, no per-version upkeep.
  # After a bump run a full `pnpm install` (not just `pnpm run check`) so pnpm's state
  # cache (node_modules/.pnpm-workspace-state-v1.json) picks up the exclude.
  #
  # Do NOT add third-party packages here as a habit: a foreign version is only worth
  # exempting while it is <1 day old AND you need it immediately; once it ages past the
  # gate the entry is dead weight — remove it. Prefer simply waiting out the ~1-day gate.
  - '@lenne.tech/*'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - simple-git-hooks
  - vue-demi

# Each override forces a vulnerable transitive dependency to a patched, FIXED
# version (never a range — avoids silent major-version jumps). Only override
# packages this project actually resolves: a dead override (package not in the
# lockfile) is useless here and, inside an lt-monorepo, a range selector like
# `pkg@<X` can shadow the api's bare `pkg: <newer>` override and re-introduce the
# CVE. Verify a candidate is live: grep "'\?<pkg>@[0-9]" pnpm-lock.yaml
#
# This list is deliberately minimal: it is the set a fresh resolve proves is still
# load-bearing. Method: copy package.json + this file (minus `overrides`) into a scratch
# dir, `pnpm install --lockfile-only`, then `pnpm audit` — only an entry whose package
# shows up there stays. On 2026-09-26 that was @nuxt/ui, esbuild and js-yaml; 13 other
# entries matched nothing a fresh resolve produces and were removed. Re-check with the
# same method before adding any new one. Re-run 2026-10-07 (fresh resolves, no lockfile,
# no node_modules): all five entries below are load-bearing — without them `pnpm audit`
# reports @nuxt/ui, simple-git + @simple-git/argv-parser, esbuild, js-yaml (three highs)
# and postcss-selector-parser. The `unhead` build-integrity pin was removed that day: it
# resolved the identical tree with or without it (see the @nuxt/ui entry, which now
# carries the single-unhead-major invariant). Re-run 2026-10-12, same method: unchanged,
# all five still load-bearing, every target is still the newest release in its major.
# Re-run 2026-10-20, same method: the `simple-git` override and its patch were removed.
# @nuxt/devtools 3.4.3+ no longer depends on simple-git, so a fresh resolve produced none,
# the patch went unused and every install stopped with ERR_PNPM_UNUSED_PATCH. The four
# remaining entries are still load-bearing.
# Re-run 2026-10-24 (better-auth 1.7.12 round, same method): all four still load-bearing,
# none holds a package below what the unrestricted resolve picks. A fifth entry was added for
# zod via bug.lt; without the overrides, `pnpm audit` reports esbuild, js-yaml (three highs),
# @nuxt/ui, postcss-selector-parser and zod.
# Re-run 2026-10-28 (nuxt 4.6.3 round), same method plus one fresh resolve per entry with only
# that entry removed: each of the five reopens its own advisory on its own, none holds a package
# below what the unrestricted resolve picks, and every target is still the newest in its major.
#
# Selector semantics (read in pnpm 11's source): a range key applies whenever it
# INTERSECTS the range a dependent requests, not only when it contains it. So
# `pkg@<X.Y.Z` also rewrites a consumer asking for `^X.Y.0` — to the exact target —
# and keeps doing so after a newer patch ships. Keep keys below the first patched
# version, never at or above it.
#
# NOTE: deliberately NO `hono` override here. hono is a BACKEND-only dependency
# (via @lenne.tech/nest-server > @modelcontextprotocol/sdk) and never resolves in
# the standalone frontend — any hono override here is dead. Worse, in an lt-monorepo
# a range selector like `hono@<X` WINS over the api's bare `hono: <newer>` override
# and pins the OLD version, silently re-introducing the patched CVEs. hono is owned
# by nest-server's overrides. Do not add it back.
overrides:
  # zod <4.6.6 (GHSA-mrhx-c7xc-m3w5, high, first patched 4.6.6); via @lenne.tech/bug.lt, whose
  # newest release (1.6.9) hard-pins zod EXACTLY at 4.1.13, so no bump can fix it. Every other
  # zod consumer (better-auth, @nuxt/ui, the @nuxtjs/seo modules) already resolves 4.6.7 on its
  # own, which is why the key is scoped to bug.lt: a bare `zod@<4.6.6` key would also intersect
  # their `^4.x` ranges and pin them (see the selector note above), and inside an lt-monorepo
  # it would reach the api's zod too. Same major, so no export-shape change. 4.6.7 is the
  # newest zod. Drop once bug.lt requests >=4.6.6 itself; the `@<4.6.6` on the child makes the
  # entry inert then, and `check-overrides.mjs` reports it. Verified 2026-10-24.
  '@lenne.tech/bug.lt>zod@<4.6.6': 4.6.7
  # @nuxt/ui UAuthForm/UForm SSR markup omits the form `method`, leaking credentials via
  # GET when submitted before hydration (GHSA-gj2h-2fpw-fhv9); via @lenne.tech/bug.lt,
  # which hard-pins @nuxt/ui@4.2.1. Target == the app's own @nuxt/ui version, so this
  # also dedupes the tree onto a single @nuxt/ui — bump both in ONE change, or the tree
  # splits into two copies.
  #
  # Key re-derived 2026-09-27: the advisory's vulnerable range was widened from <4.7.2
  # to <4.8.1 (first patched 4.8.1) after this entry was written.
  #
  # Raised 4.11.2 -> 4.11.3 together with the app's own @nuxt/ui dependency. Key re-checked
  # against the advisory database 2026-10-03: GHSA-gj2h-2fpw-fhv9 is still the only @nuxt/ui
  # advisory and still `<4.8.1`.
  #
  # Raised 4.11.3 -> 4.12.0 (key unchanged) together with the app's own @nuxt/ui dependency.
  # Re-checked 2026-10-24: GHSA-gj2h-2fpw-fhv9 is still the only @nuxt/ui advisory, still
  # `<4.8.1`, and bug.lt 1.6.9 is still the newest release with its 4.2.1 pin.
  #
  # This entry ALSO keeps the tree on exactly one unhead major (build integrity). bug.lt's
  # hard-pinned @nuxt/ui@4.2.1 carries `@unhead/vue@2` / `unhead@2`; with two unhead majors,
  # Nitro's externals tracer copies a partial second copy into
  # `.output/server/node_modules/unhead` and every SSR request of the BUILT app dies with
  # 500 ERR_MODULE_NOT_FOUND (dev mode is unaffected). @nuxt/ui 4.11.3 itself depends on
  # `@unhead/vue ^3.4.1`, so lifting 4.2.1 is what removes the last v2 consumer. A fresh
  # resolve without this entry brings unhead 2.1.17 back next to 3.4.x. That is why the
  # separate `unhead` pin could go on 2026-10-07: it resolved the identical package set with
  # or without it, its own drop condition ("once @nuxt/ui carries a v3 peer itself") was met,
  # and as an exact pin it risked turning into a downgrade lock below nuxt's own `unhead`
  # range. `tests/unit/unhead-single-major.test.ts` still guards the invariant on the
  # lockfile. If this entry is ever dropped (bug.lt moving to a patched @nuxt/ui), re-check
  # `pnpm why unhead` for a single major first. Verified 2026-10-07.
  '@nuxt/ui@<4.8.1': 4.12.0
  # esbuild dev-server advisories - transitive via vite tooling. The key covers both:
  #   - GHSA-g7r4-m6w7-qqqr (low): arbitrary file read via the dev server on Windows,
  #     >=0.27.3 <0.28.1, first patched 0.28.1. This is the one the `<0.28.1` bound encodes.
  #   - GHSA-67mh-4wv8-2f99 (medium): any website can send requests to the dev server and
  #     read the response, <=0.24.2, first patched 0.25.0.
  # (This comment previously cited GHSA-67mh for the 0.27.3-0.28.1 window; that range
  # belongs to GHSA-g7r4.) 0.28.2 is the newest 0.28.x. Verified 2026-09-27.
  # Re-verified 2026-10-03: key matches the advisory database, 0.28.2 is still the newest
  # 0.28.x, and a fresh resolve without this entry brings esbuild 0.27.7 (GHSA-g7r4) back.
  'esbuild@<0.28.1': 0.28.2
  # js-yaml quadratic CPU consumption via YAML merge-key chains (GHSA-52cp-r559-cp3m, high),
  # incompletely fixed in 4.3.0 — the follow-up advisory is patched only in 4.3.1.
  # Transitive via @hey-api/openapi-ts>@hey-api/json-schema-ref-parser.
  #
  # Raised 4.3.1 -> 4.3.2 (key and target) for GHSA-2883-xcg3-v3hh (high, patched >=4.3.2);
  # 4.3.2 is the newest 4.x. Load-bearing, not a leftover: json-schema-ref-parser 1.4.4 (its
  # latest) pins js-yaml EXACTLY at 4.2.0, so no bump can fix it. A fresh resolve without
  # this entry gives 4.2.0 with three high advisories. Drop once the parser requests
  # >=4.3.2 itself. Verified 2026-09-14.
  # Re-verified 2026-10-03: the parser is still 1.4.4 with js-yaml pinned at 4.2.0, 4.3.2 is
  # still the newest 4.x, and a fresh resolve without this entry reports three high
  # advisories again. GHSA-r3ph-w7gj-g6xm (2026-09-29) affects only the 5.x line, which this
  # tree does not resolve.
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  # postcss-selector-parser, quadratic complexity when parsing flat selectors
  # (GHSA-rj75-hqrm-r3gf, moderate). Two vulnerable lines: `<6.1.5` (first patched 6.1.5) and
  # `>=7.0.0 <7.1.6` (first patched 7.1.6). Transitive via @tailwindcss/typography, whose newest
  # release (0.5.20) pins it EXACTLY at 6.0.10, so no bump can fix it. typography is the only
  # consumer.
  #
  # Same major on purpose: 6.0.10 -> 6.1.5, the patched release in typography's own line. Until
  # 2026-10-26 the advisory named no 6.x fix, so this entry jumped to 7.x (`<7.1.6`: 7.1.7, CSS
  # measured byte-identical). With 6.1.5 out that jump was no longer needed, and its key spanned
  # the already-patched 6.1.5+ releases, so in an lt-monorepo it would have forced any `^6`
  # consumer onto 7.x. Measured 2026-10-28 before switching: Tailwind 4.3.3 compiled the
  # typography plugin (prose, every size and gray scale, invert, not-prose, element and
  # pseudo-element variants such as prose-li:marker) against 6.0.10, 6.1.5 and 7.1.7, and the
  # CSS came out byte-identical (74,277 bytes, one SHA-256). The parser is pure build tooling
  # here and is not traced into `.output/`.
  #
  # The key stays below the first patched version (see the selector note above). Drop this
  # entry once @tailwindcss/typography requests >=6.1.5 itself.
  'postcss-selector-parser@<6.1.5': 6.1.5

patchedDependencies:
  # reka-ui 2.10.0+ hides every toast from screen readers. ToastAnnounce wraps the
  # role="alert" / aria-live region in `VisuallyHidden feature="fully-hidden"`, and since 2.10.0
  # that feature also sets aria-hidden="true". The live region then sits in an aria-hidden
  # subtree and is never announced, while the toast still renders visibly
  # (unovue/reka-ui#3049). The patch drops that one prop in `dist/Toast/ToastAnnounce.{js,cjs}`,
  # so the announcer falls back to the default `focusable` feature, which in 2.11.0 is visually
  # hidden only, and screen readers reach it again as in 2.9.x. Only 2.11.0: in 2.10.x `focusable`
  # is aria-hidden as well, so the same edit would change nothing there. It is a backport, not our
  # own fix: byte for byte the change upstream merged in unovue/reka-ui#3050 on 2026-10-26, which
  # no release carries yet (newest: 2.11.0).
  # @nuxt/ui 4.12.0 pins reka-ui EXACTLY at 2.11.0, so the exact key cannot drift while @nuxt/ui
  # stays put. `tests/unit/toast-live-region.test.ts` checks the behaviour, not the patch, and
  # stays after the patch is gone.
  #
  # Delete this entry and `patches/reka-ui@2.11.0.patch` together once @nuxt/ui resolves a
  # reka-ui release that contains #3050. pnpm forces the issue: as soon as reka-ui moves off
  # 2.11.0, every install stops with ERR_PNPM_UNUSED_PATCH until both are gone. Verified
  # 2026-10-28.
  #
  # pnpm reads `patchedDependencies` only from the workspace root. In an `lt fullstack` monorepo
  # the lt CLI (from 1.50.4; older versions drop the entry) hoists it and moves the patch file to
  # `<root>/patches/`, and the Dockerfile copies the context-root `patches/` before installing.
  reka-ui@2.11.0: patches/reka-ui@2.11.0.patch
