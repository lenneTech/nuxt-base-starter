# pnpm settings for the nuxt-base-template (single-package project).
#
# IMPORTANT: This file intentionally has NO `packages:` field. It carries
# ONLY workspace-scoped settings (overrides, ignoredOptionalDependencies,
# allowBuilds / onlyBuiltDependencies). This is the pnpm-recommended home for
# these keys and is read by pnpm 10 AND pnpm 11. (pnpm 11 silently ignores the
# same keys when they live in package.json's `pnpm` block.)
#
# All override TARGETS (right-hand side) are FIXED versions, never ranges,
# to prevent silent major-version jumps (see TurboOps incident, April 2026).
# The LEFT side may carry a range to scope which vulnerable versions are
# replaced. The advisory table for every override lives in CLAUDE.md.

# pnpm 11 renamed `onlyBuiltDependencies` to `allowBuilds` (map of pkg -> bool).
# We keep BOTH keys so the file works across pnpm 10 (reads onlyBuiltDependencies)
# and pnpm 11 (reads allowBuilds); each version ignores the key it doesn't know.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  simple-git-hooks: true
  vue-demi: true

ignoredOptionalDependencies:
  - '@img/sharp-linux-arm'
  - '@img/sharp-linux-arm64'
  - '@img/sharp-linux-ppc64'
  - '@img/sharp-linux-riscv64'
  - '@img/sharp-linux-s390x'
  - '@img/sharp-linux-x64'
  - '@img/sharp-linuxmusl-arm64'
  - '@img/sharp-linuxmusl-x64'
  - '@img/sharp-win32-arm64'
  - '@img/sharp-win32-ia32'
  - '@img/sharp-win32-x64'
  - '@img/sharp-wasm32'
  - '@img/sharp-libvips-linux-arm'
  - '@img/sharp-libvips-linux-arm64'
  - '@img/sharp-libvips-linux-ppc64'
  - '@img/sharp-libvips-linux-riscv64'
  - '@img/sharp-libvips-linux-s390x'
  - '@img/sharp-libvips-linux-x64'
  - '@img/sharp-libvips-linuxmusl-arm64'
  - '@img/sharp-libvips-linuxmusl-x64'
  - '@resvg/resvg-js-android-arm-eabi'
  - '@resvg/resvg-js-android-arm64'
  - '@resvg/resvg-js-linux-arm-gnueabihf'
  - '@resvg/resvg-js-linux-arm64-gnu'
  - '@resvg/resvg-js-linux-arm64-musl'
  - '@resvg/resvg-js-linux-x64-gnu'
  - '@resvg/resvg-js-linux-x64-musl'
  - '@resvg/resvg-js-win32-arm64-msvc'
  - '@resvg/resvg-js-win32-ia32-msvc'
  - '@resvg/resvg-js-win32-x64-msvc'

minimumReleaseAgeExclude:
  # ONLY our own first-party scope. The glob exempts every @lenne.tech package and
  # every fresh release from the minimum-release-age gate (honored at resolution AND
  # lockfile-verify time) — installable the moment we publish, no per-version upkeep.
  # After a bump run a full `pnpm install` (not just `pnpm run check`) so pnpm's state
  # cache (node_modules/.pnpm-workspace-state-v1.json) picks up the exclude.
  #
  # Do NOT add third-party packages here as a habit: a foreign version is only worth
  # exempting while it is <1 day old AND you need it immediately; once it ages past the
  # gate the entry is dead weight — remove it. Prefer simply waiting out the ~1-day gate.
  - '@lenne.tech/*'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - sharp
  - simple-git-hooks
  - vue-demi

# Each override forces a vulnerable transitive dependency to a patched, FIXED
# version (never a range — avoids silent major-version jumps). Only override
# packages this project actually resolves: a dead override (package not in the
# lockfile) is useless here and, inside an lt-monorepo, a range selector like
# `pkg@<X` can shadow the api's bare `pkg: <newer>` override and re-introduce the
# CVE. Verify a candidate is live: grep "'\?<pkg>@[0-9]" pnpm-lock.yaml
#
# This list is deliberately minimal: it is the set that `pnpm audit` proves is still
# load-bearing. Every other override was removed once upstream shipped the fix
# naturally (verified by resolving with zero overrides — only the three below
# re-introduced advisories). Re-check with the same method before adding any new one.
#
# NOTE: deliberately NO `hono` override here. hono is a BACKEND-only dependency
# (via @lenne.tech/nest-server > @modelcontextprotocol/sdk) and never resolves in
# the standalone frontend — any hono override here is dead. Worse, in an lt-monorepo
# a range selector like `hono@<X` WINS over the api's bare `hono: <newer>` override
# and pins the OLD version, silently re-introducing the patched CVEs. hono is owned
# by nest-server's overrides. Do not add it back.
overrides:
  # Build integrity, not a CVE: nuxt 4.4.x is built against unhead v2
  # (@unhead/vue ^2.1.15), but nuxt-seo-utils >=8.1.10 hard-depends on
  # @unhead/bundler v3 and nuxt-schema-org resolves its `unhead ^2 || ^3`
  # peer to v3 — TWO unhead majors in the tree. Nitro's externals tracer
  # then copies a partial unhead v3 into `.output/server/node_modules/unhead`
  # (missing dist/server.mjs), so EVERY SSR request of the built app dies
  # with 500 ERR_MODULE_NOT_FOUND (dev mode is unaffected; Playwright E2E
  # against the built output catches it). Pin the SEO chain to the last
  # pure-v2 nuxt-seo-utils and force the unhead peer to nuxt's own version
  # so exactly ONE unhead resolves. Remove both once nuxt itself moves to
  # unhead v3 (then drop the pins and re-verify with `pnpm why unhead`:
  # exactly one version must remain).
  'nuxt-seo-utils': 8.1.8
  'unhead': 2.1.15
  # Lifts every minimatch 5.x–9.x consumer onto 10.x so it inherits the PATCHED
  # brace-expansion 5.x — see the brace-expansion note further down for why minimatch is
  # the lever. Closes the nitro>archiver and readdir-glob chains; the lockfile now
  # resolves a single `minimatch@10.2.5` and a single `brace-expansion@5.0.8`.
  #
  # Export-shape check, which is what makes a cross-major lift safe or not. Measured by
  # installing each version and reading `typeof require('minimatch')` (2026-07-30):
  #   5.1.9 function · 6.2.0 function · 7.4.6 function · 8.0.4 function
  #   9.0.9 object   · 10.2.5 object
  # So 5.x–8.x ARE callable, and a consumer doing `require('minimatch')(…)` would break
  # on 10.x. The key spans them anyway because only ONE such consumer resolves here —
  # `readdir-glob@1.1.3`, which does `const { Minimatch } = require('minimatch')` (a named
  # destructure, not a call) and was exercised against 10.2.5 without error. Re-verify
  # this if a new 5.x–8.x consumer enters the tree; a narrower key would drop
  # readdir-glob back to minimatch@5 and re-open the brace-expansion chain, which is why
  # the range is not simply tightened to >=9.
  #
  # minimatch@3 is deliberately not covered — its consumers DO call it as a callable.
  'minimatch@>=5.0.0 <10.2.5': 10.2.5
  # @nuxt/ui UAuthForm/UForm SSR markup omits the form `method`, leaking credentials via
  # GET when submitted before hydration (GHSA-gj2h-2fpw-fhv9); via @lenne.tech/bug.lt,
  # which hard-pins @nuxt/ui@4.2.1. Target 4.10.0 == the app's own @nuxt/ui version, so
  # this also dedupes the tree onto a single @nuxt/ui.
  '@nuxt/ui@<4.7.2': 4.10.0
  # esbuild dev-server request smuggling (GHSA-67mh-4wv8-2f99, >=0.27.3 <0.28.1) - transitive via vite tooling.
  'esbuild@<0.28.1': 0.28.1
  # sharp: use-after-free / heap buffer overflow when decoding a malformed image
  # (GHSA-f88m-g3jw-g9cj, high, patched >=0.35.0). Transitive via @nuxt/image>ipx>sharp,
  # which reaches user-supplied images on any /_ipx/ route — so this is a live path, not
  # a build-time-only concern. Bounded key so it can only raise a vulnerable version and
  # never cap a patched one. Drop once ipx requests >=0.35.0 itself.
  'sharp@<0.35.0': 0.35.3
  # tar: multiple advisories across the 7.x line. Transitive via
  # @lenne.tech/nuxt-extensions>nuxt>@nuxt/nitro-*. Bounded key so it can only raise.
  # Drop once nitro requests a patched tar itself.
  # NOTE: this used to read `<7.5.20: 7.5.20`, pinning to a version GHSA-r292-9mhp-454m
  # itself covers (`<=7.5.20`) — 21 paths looked handled while staying vulnerable.
  'tar@<7.5.21': 7.5.21
  # postcss <=8.5.17 (GHSA-r28c-9q8g-f849, high), patched >=8.5.18. Build-time only, via
  # nuxt>@nuxt/vite-builder>autoprefixer/cssnano (100 paths). Bounded key so it can only raise.
  'postcss@<8.5.18': 8.5.18
  # brace-expansion DoS via unbounded expansion (GHSA-mh99-v99m-4gvg, high). Patched ONLY
  # in 5.0.8 — there is no 2.x backport, so the 2.x key below merely keeps that major on its
  # newest release.
  #
  # Which line a path gets is decided by its `minimatch`, so that is the real lever:
  #   minimatch@10 -> brace-expansion@5  (patched)   minimatch@9 -> brace-expansion@2
  # The `minimatch` key above lifts every 9.x consumer onto 10.x, which moves the whole
  # nitro>archiver / readdir-glob chain onto the patched line.
  #
  # NOTE the 5.x key: it used to read `>=5.0.0 <5.0.7: 5.0.7`, pinning to a version the
  # advisory itself covers (`<=5.0.7`) — 22 paths under @vercel/nft looked handled while
  # staying vulnerable. Now on 5.0.8.
  #
  # The 2.x key that used to sit here was REMOVED: the minimatch lift above eliminated
  # the 2.x line entirely, so it matched nothing (`grep "brace-expansion@[0-9]"
  # pnpm-lock.yaml` → only 5.0.8, verified 2026-07-30). This file's own rule is to
  # override only what the project actually resolves — a dead key is noise here, and
  # inside an `lt fullstack` monorepo it can shadow the api's override.
  #
  # The floor is >=3.0.0 rather than >=5.0.0 so a 3.x/4.x dependency entering the tree
  # is lifted onto the patched line too. Safe across those majors: 4.0.1 and 5.0.8 both
  # export a namespace object, and only 1.x/2.x are callable — both below the floor.
  'brace-expansion@>=3.0.0 <5.0.8': 5.0.8
  # js-yaml quadratic CPU consumption via YAML merge-key chains (GHSA-52cp-r559-cp3m, high).
  # Transitive via @hey-api/openapi-ts>@hey-api/json-schema-ref-parser.
  'js-yaml@>=4.0.0 <4.3.0': 4.3.0
  # shell-quote command injection via improperly escaped shell metacharacters
  # (GHSA-g4rg-993r-mgx7, patched >=1.8.5). Transitive, build-time only, via
  # @nuxt/devtools>execa tooling. Target 1.10.0 rather than the 1.8.5 floor: it is the
  # current release on the same major, so the tree resolves one copy instead of two.
  # Bounded key — it can only raise a vulnerable version. Drop once the consumers
  # request >=1.8.5 themselves. Verified 2026-07-30.
  'shell-quote@<1.8.5': 1.10.0
  # svgo ReDoS in the SVG path parser (GHSA-8w4h-3c9p-7c9r, patched >=4.0.2).
  # Build-time only, transitive via @nuxt/vite-builder>@nuxt/image image optimisation.
  # Bounded key so it can only raise a vulnerable 4.0.x and never cap a later one.
  # Drop once @nuxt/image requests >=4.0.2. Verified 2026-07-30.
  'svgo@>=4.0.0 <4.0.2': 4.0.2
  # fast-xml-parser ReDoS (GHSA-8r6m-32jq-jx6q, high). Transitive via @nuxtjs/seo>@nuxtjs/sitemap.
  'fast-xml-parser@>=5.9.3 <5.10.1': 5.10.1
