# pnpm settings for the create-nuxt-base scaffolder (single-package project).
#
# IMPORTANT: This file intentionally has NO `packages:` field. It carries
# ONLY workspace-scoped settings. This is the pnpm-recommended home for these
# keys and is read by pnpm 10 AND pnpm 11. (pnpm 11 silently ignores the same
# keys when they live in package.json's `pnpm` block.)
#
# There are currently NO overrides here, and that is intentional: standard-version's
# transitive tree now resolves to patched versions on its own (handlebars 4.7.9,
# lodash 4.18.1, minimatch 3.1.5, brace-expansion 1.1.16), so the four overrides that
# used to live here were dead weight and were removed. Verified by resolving with zero
# overrides and no lockfile: `pnpm audit` reports no known vulnerabilities.
#
# If you ever need to add one back: the override TARGET (right-hand side) must be a
# FIXED version, never a range — an unbounded target like `>=X` lets pnpm jump a major.
# Only override packages this project actually resolves; verify a candidate is live
# with: grep "'\?<pkg>@[0-9]" pnpm-lock.yaml
