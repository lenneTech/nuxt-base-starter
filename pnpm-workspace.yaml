# pnpm settings for the create-nuxt-base scaffolder (single-package project).
#
# IMPORTANT: This file intentionally has NO `packages:` field. It carries
# ONLY workspace-scoped settings. This is the pnpm-recommended home for these
# keys and is read by pnpm 10 AND pnpm 11. (pnpm 11 silently ignores the same
# keys when they live in package.json's `pnpm` block.)
#
# No overrides and no patches live here. The last pair, `'brace-expansion@<5.0.12': 5.0.12`
# plus `patches/minimatch@3.1.5.patch`, was removed on 2026-10-06. brace-expansion now
# backports its fixes per major (1.1.21 closes GHSA-mh99-v99m-4gvg, GHSA-3jxr-9vmj-r5cp,
# GHSA-rgw5-rvv9-x895, GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7 and GHSA-q2hr-2g5m-vwhr on the
# 1.x line), and a fresh resolve WITHOUT either (no pnpm-lock.yaml, no node_modules) gives
# brace-expansion 1.1.21 under standard-version > dotgitignore > minimatch@3.1.5 with
# `pnpm audit` clean. The override had stopped closing anything: it only lifted that one dev
# path across a major, and the patch existed solely to make that lift work. The handlebars,
# lodash and minimatch overrides went the same way earlier.
#
# When you add one: prove it is needed first (scratch copy of package.json + this file, no
# pnpm-lock.yaml, no node_modules, `pnpm install --lockfile-only`, `pnpm audit`). The
# override TARGET (right-hand side) must be a FIXED version, never a range — an unbounded
# target like `>=X` lets pnpm jump a major. Only override packages this project actually
# resolves; verify a candidate is live with: grep "'\?<pkg>@[0-9]" pnpm-lock.yaml
# Put each entry's reason as an indented comment directly above its own key.

# ----------------------------------------------------------------------------------
# No accepted advisories.
#
# There is deliberately no `auditConfig.ignoreGhsas` block here. Suppression makes
# `pnpm audit` green while the vulnerability is still present, so it is the last
# resort — and this repo currently needs none.
#
# If one ever becomes unavoidable, the bar is: name the advisory, trace the resolution
# path, say why it cannot be fixed, say why the residual risk is acceptable (who runs
# the code, over what input, whether it reaches a generated project), give the
# condition for deleting the entry, and date the verification. One GHSA id per entry —
# never a range or a whole package — so anything new still turns the audit red.
#
# Worth knowing before reaching for it: the brace-expansion advisory LOOKED unfixable
# and was suppressed here for exactly that reason. It was not. The only patched release
# (5.0.8) had switched its CJS export from a callable to a namespace object, which broke
# minimatch@3's `require('brace-expansion')(pattern)`; a one-line patchedDependencies
# entry reading `.expand` off the namespace closed it (2026-07-30). Work the ladder in
# nuxt-base-template/CLAUDE.md ("Security Overrides") before suppressing anything.
# ----------------------------------------------------------------------------------
